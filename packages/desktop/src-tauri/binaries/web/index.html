<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>materin</title>
    <style>
      :root {
        color-scheme: dark;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --bg: #14161a;
        --panel: #1c1f24;
        --border: #2b2f36;
        --text: #d7dae0;
        --dim: #8a8f98;
        --accent: #4c8dff;
        --user-bg: #2a4a80;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
      }
      #sidebar {
        width: 260px;
        min-width: 260px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 8px;
      }
      #sidebar h1 { font-size: 15px; margin: 2px 0 4px; }
      #new-session {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 7px;
        cursor: pointer;
      }
      #search-input, #composer textarea {
        background: #121418;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 7px;
        font: inherit;
      }
      #search-input { width: 100%; }
      #session-list, #search-results { overflow-y: auto; }
      #session-list { flex: 1; }
      .session-item {
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-item:hover, .session-item.active { background: #262a31; }
      .session-item .sid { color: var(--dim); font-size: 12px; }
      .search-hit { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
      .search-hit:hover { background: #262a31; }
      .search-hit .snippet { color: var(--dim); }
      #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #messages {
        flex: 1; overflow-y: auto; padding: 16px 20px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.45;
      }
      .msg { margin-bottom: 8px; }
      .msg.user { text-align: right; }
      .bubble {
        display: inline-block;
        text-align: left;
        max-width: 78%;
        padding: 8px 12px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user .bubble { background: var(--user-bg); }
      .msg.assistant .bubble { background: var(--panel); }
      .msg img { max-width: 400px; border-radius: 8px; display: block; margin-top: 6px; }
      pre {
        background: #0d0f12;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        overflow-x: auto;
        white-space: pre;
        text-align: left;
      }
      details.tool { margin: 4px 0; color: var(--dim); font-size: 13px; }
      summary { cursor: pointer; }
      .tool-result { color: var(--dim); font-size: 12px; margin: 2px 0 8px; white-space: pre-wrap; }
      .diff-del { background: #4a1f24; color: #ff9b9b; }
      .diff-add { background: #1d3a24; color: #9be29b; }
      .system-line { color: var(--dim); font-style: italic; margin: 6px 0; }
      #pending-images { display: flex; gap: 6px; flex-wrap: wrap; }
      #pending-images .chip { position: relative; }
      #pending-images img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
      #pending-images button {
        position: absolute; top: -6px; right: -6px;
        background: #333; color: #fff; border: 0; border-radius: 50%;
        width: 18px; height: 18px; cursor: pointer; font-size: 11px; line-height: 1;
      }
      #composer { padding: 12px 20px; border-top: 1px solid var(--border); position: relative; }
      #composer textarea {
        width: 100%; resize: vertical; min-height: 44px; max-height: 200px;
        font-family: var(--mono); font-size: 13px;
        background: #0d0f12;
      }
      #composer textarea:focus { outline: none; border-color: var(--accent); }
      #config-btn {
        background: transparent; color: var(--dim); border: 1px solid var(--border);
        border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px;
      }
      #config-btn:hover { color: var(--text); border-color: var(--accent); }
      .session-del {
        float: right; background: transparent; color: var(--dim);
        border: 0; cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px;
      }
      .session-del:hover { color: #ff9b9b; }
      .toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: #262a31; color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 8px 16px; font-size: 13px; z-index: 100;
      }
      .config-modal {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
        display: none; align-items: center; justify-content: center; z-index: 90;
      }
      .cfg-panel {
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
        padding: 18px; width: 380px; display: flex; flex-direction: column; gap: 10px;
      }
      .cfg-title { font-size: 15px; font-weight: 600; }
      .cfg-row { display: flex; flex-direction: column; gap: 4px; }
      .cfg-label { color: var(--dim); font-size: 12px; }
      .cfg-panel input, .cfg-panel select {
        background: #121418; border: 1px solid var(--border); border-radius: 6px;
        color: var(--text); padding: 7px; font: inherit; font-size: 13px;
      }
      .cfg-status { color: var(--dim); font-size: 12px; }
      .cfg-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .cfg-btn {
        background: var(--accent); color: #fff; border: 0; border-radius: 6px;
        padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px;
      }
      .cfg-btn.secondary { background: #262a31; }
      #file-ac {
        position: absolute; bottom: 100%; left: 20px; right: 20px;
        background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
        max-height: 240px; overflow-y: auto; z-index: 10; display: none;
      }
      #file-ac .ac-item { padding: 5px 10px; cursor: pointer; font-size: 12px; font-family: ui-monospace, monospace; }
      #file-ac .ac-item:hover, #file-ac .ac-item.active { background: #262a31; }
      #mode-select {
        background: #121418; border: 1px solid var(--border); border-radius: 6px;
        color: var(--text); padding: 4px 8px; font: inherit; font-size: 12px;
      }
      #header { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--border); }
      #pending-images .chip.file-chip {
        background: #121418; border: 1px solid var(--border); border-radius: 6px;
        padding: 4px 8px; font-size: 12px; color: var(--dim);
        display: flex; align-items: center; gap: 6px;
      }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <h1>materin</h1>
      <button id="new-session">+ New session</button>
      <input id="search-input" placeholder="Search messages… (Enter)" />
      <div id="search-results"></div>
      <div id="session-list"></div>
    </aside>
    <main id="main">
      <div id="header">
        <button id="config-btn">⚙ 配置</button>
        <label for="mode-select" style="color: var(--dim); font-size: 12px;">mode</label>
        <select id="mode-select">
          <option value="plan">plan</option>
          <option value="manual">manual</option>
          <option value="auto">auto</option>
          <option value="passon">passon</option>
        </select>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <div id="pending-images"></div>
        <div id="file-ac"></div>
        <textarea id="input" placeholder="Message materin… (Enter to send, Shift+Enter for newline, @ for files)"></textarea>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
